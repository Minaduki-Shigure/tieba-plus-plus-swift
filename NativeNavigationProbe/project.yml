name: NavigationProbe
options:
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  NavigationProbe:
    type: application
    platform: iOS
    sources:
      - App.swift
      - SupportingTypes.swift
      - ../App/Sources/RootAdaptiveNavigation.swift
      - ../App/Sources/RootTabBar.swift
    settings:
      base:
        PRODUCT_MODULE_NAME: TiebaPlusPlus
        PRODUCT_BUNDLE_IDENTIFIER: io.github.minaduki.navigation-probe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  NavigationProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../App/Tests/RootAdaptiveNavigationTests.swift
      - ../App/Tests/RootTabBarTests.swift
    dependencies:
      - target: NavigationProbe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.minaduki.navigation-probe-tests
schemes:
  NavigationProbe:
    build:
      targets:
        NavigationProbe: all
        NavigationProbeTests: [test]
    test:
      targets: [NavigationProbeTests]
