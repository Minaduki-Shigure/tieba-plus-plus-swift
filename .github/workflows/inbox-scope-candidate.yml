name: Inbox scopes candidate
on:
  push:
    branches: [ci/inbox-scope-native-1004]
permissions:
  contents: read
jobs:
  inbox-scopes:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Select iPhone simulator
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | jq -r '
            [.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] as $phones
            | (($phones | map(select(.name == "iPhone 16 Pro"))) + $phones | .[0].udid // empty)
          ')"
          test -n "$device_id"
          echo "INBOX_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
      - name: Verify inbox lifecycle and reply admission
        id: models
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlus \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination "$INBOX_SIMULATOR_DESTINATION" -parallel-testing-enabled NO \
            -only-testing:TiebaPlusPlusTests/NotificationsViewModelTests \
            -only-testing:TiebaPlusPlusTests/NotificationsActivityViewModelTests \
            -only-testing:TiebaPlusPlusTests/InboxReplyIntentTests \
            -resultBundlePath inbox-model-results.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee inbox-model-test.log
      - name: Verify native inbox scope navigation
        id: ui
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlusIconsUI \
            -configuration Debug -derivedDataPath build/DerivedData -enableCodeCoverage YES \
            -destination "$INBOX_SIMULATOR_DESTINATION" -parallel-testing-enabled NO \
            -only-testing:TiebaPlusPlusUITests/InboxScopesUITests \
            -resultBundlePath inbox-ui-results.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee inbox-ui-test.log
      - name: Export model results
        if: always()
        run: |
          xcrun xcresulttool get test-results summary \
            --path inbox-model-results.xcresult --compact > inbox-model-summary.json
      - name: Export UI evidence
        if: always()
        run: |
          xcrun xcresulttool get test-results summary \
            --path inbox-ui-results.xcresult --compact > inbox-ui-summary.json
          xcrun xcresulttool export attachments \
            --path inbox-ui-results.xcresult --output-path inbox-ui-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-scope-candidate
          path: |
            inbox-model-test.log
            inbox-model-summary.json
            inbox-ui-test.log
            inbox-ui-summary.json
            inbox-ui-attachments/
      - name: Enforce both validations
        if: ${{ always() && (steps.models.outcome != 'success' || steps.ui.outcome != 'success') }}
        run: exit 1
