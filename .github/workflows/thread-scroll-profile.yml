name: Thread scroll profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/thread-scroll-profile.yml
      - App/PerformanceTests/**
      - App/Sources/BrowseContentView.swift
      - App/Sources/InlineCommentPreview.swift
      - App/Sources/ReplyModels.swift
      - App/Sources/ThreadScrollPerformanceScenario.swift
      - App/Sources/ThreadView.swift
      - App/Sources/TiebaPlusPlusApp.swift
      - Scripts/analyze_time_profile.rb
      - Scripts/record_thread_scroll_profiles.sh
      - Scripts/summarize_thread_scroll_profile.rb
      - project.yml

permissions:
  contents: read
  checks: write

concurrency:
  group: thread-scroll-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-18-simulator:
    name: iOS 18.5 simulator profile
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      ARTIFACT_DIR: build/thread-scroll-profile
      DERIVED_DATA: build/thread-scroll-derived-data
      BUNDLE_ID: io.github.minaduki.tieba-plus-plus
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen_version="$(xcodegen --version | awk '{print $NF}')"
          ruby -rrubygems -e '
            abort "XcodeGen #{ARGV[0]} is older than 2.45.4" if
              Gem::Version.new(ARGV[0]) < Gem::Version.new("2.45.4")
          ' "$xcodegen_version"

      - name: Generate profile project
        run: xcodegen generate

      - name: Select fixed iOS 18.5 simulator
        id: simulator
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          device_json="$(xcrun simctl list devices available -j)"
          device_id="$(jq -r '
            [
              .devices
              | to_entries[]
              | select(.key | endswith("iOS-18-5"))
              | .value[]
              | select(.isAvailable == true and .name == "iPhone 16 Pro")
            ][0].udid // empty
          ' <<< "$device_json")"
          if [ -z "$device_id" ]; then
            echo "The fixed iOS 18.5 iPhone 16 Pro simulator is unavailable." >&2
            xcrun simctl list runtimes
            xcrun simctl list devices available
            exit 1
          fi
          echo "IOS_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b

      - name: Record environment
        run: |
          set -euo pipefail
          {
            echo "Commit: $GITHUB_SHA"
            echo "Runner: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            xcodebuild -version
            echo "Simulator: $IOS_SIMULATOR_ID"
            xcrun simctl list devices -j | jq -r --arg id "$IOS_SIMULATOR_ID" '
              .devices[][] | select(.udid == $id) | "Device: \(.name) (\(.udid)) state=\(.state)"
            '
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            sysctl -n hw.logicalcpu 2>/dev/null || true
            echo "Available xctrace templates:"
            xcrun xctrace list templates
          } > "$ARTIFACT_DIR/environment.txt" 2>&1

      - name: Build optimized performance harness
        id: build_profile
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild \
            -project TiebaPlusPlus.xcodeproj \
            -scheme TiebaPlusPlusPerformance \
            -configuration Profile \
            -destination "$IOS_SIMULATOR_DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$ARTIFACT_DIR/build.log"

      - name: Report profile build diagnostics
        if: ${{ always() && steps.build_profile.outcome == 'failure' }}
        run: ruby Scripts/report_xcode_errors.rb "$ARTIFACT_DIR/build.log"

      - name: Collect application symbols
        id: symbols
        if: ${{ steps.build_profile.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          symbol_path="$(find "$DERIVED_DATA/Build/Products" \
            -type d -name 'TiebaPlusPlus.app.dSYM' -print -quit)"
          test -n "$symbol_path"
          ditto "$symbol_path" "$ARTIFACT_DIR/TiebaPlusPlus.app.dSYM"
          test -f "$ARTIFACT_DIR/TiebaPlusPlus.app.dSYM/Contents/Info.plist"

      - name: Record self-driven Time Profiler traces
        id: time_profiler
        if: ${{ steps.build_profile.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          app_path="$(find "$DERIVED_DATA/Build/Products/Profile-iphonesimulator" \
            -maxdepth 1 -type d -name 'TiebaPlusPlus.app' -print -quit)"
          test -n "$app_path"
          bash Scripts/record_thread_scroll_profiles.sh \
            "$IOS_SIMULATOR_ID" \
            "$BUNDLE_ID" \
            "$app_path" \
            "$ARTIFACT_DIR"

      - name: Analyze exported Time Profiler samples
        id: trace_analysis
        if: ${{ always() && steps.time_profiler.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          failed=0
          for scenario in baseline long-plain-text inline-replies many-floors; do
            samples="$ARTIFACT_DIR/time-profiler-$scenario-samples.xml"
            analysis="$ARTIFACT_DIR/time-profiler-$scenario-analysis.json"
            if [ ! -s "$samples" ]; then
              echo "$scenario: samples unavailable" >&2
              failed=1
              continue
            fi
            if ! ruby Scripts/analyze_time_profile.rb "$samples" > "$analysis"; then
              failed=1
              continue
            fi
            if ! jq empty "$analysis"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Build readable profile report
        id: report
        if: ${{ always() }}
        env:
          PROFILE_BUILD_OUTCOME: ${{ steps.build_profile.outcome }}
          PROFILE_SYMBOLS_OUTCOME: ${{ steps.symbols.outcome }}
          PROFILE_XCTRACE_OUTCOME: ${{ steps.time_profiler.outcome }}
          PROFILE_TRACE_ANALYSIS_OUTCOME: ${{ steps.trace_analysis.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          {
            echo "Build outcome: ${PROFILE_BUILD_OUTCOME:-unknown}"
            echo "Symbols outcome: ${PROFILE_SYMBOLS_OUTCOME:-unknown}"
            echo "Time Profiler outcome: ${PROFILE_XCTRACE_OUTCOME:-unknown}"
            echo "Trace analysis outcome: ${PROFILE_TRACE_ANALYSIS_OUTCOME:-unknown}"
            if [ -s "$ARTIFACT_DIR/time-profiler-scenarios.txt" ]; then
              cat "$ARTIFACT_DIR/time-profiler-scenarios.txt"
            fi
          } >> "$ARTIFACT_DIR/environment.txt"
          ruby Scripts/summarize_thread_scroll_profile.rb \
            --build-log "$ARTIFACT_DIR/build.log" \
            --xctrace-log "$ARTIFACT_DIR/xctrace.log" \
            --xctrace-toc "$ARTIFACT_DIR/time-profiler-long-plain-text-toc.xml" \
            --xctrace-profile "$ARTIFACT_DIR/time-profiler-long-plain-text-samples.xml" \
            --analysis "baseline=$ARTIFACT_DIR/time-profiler-baseline-analysis.json" \
            --analysis "long-plain-text=$ARTIFACT_DIR/time-profiler-long-plain-text-analysis.json" \
            --analysis "inline-replies=$ARTIFACT_DIR/time-profiler-inline-replies-analysis.json" \
            --analysis "many-floors=$ARTIFACT_DIR/time-profiler-many-floors-analysis.json" \
            --environment "$ARTIFACT_DIR/environment.txt" \
            --output "$ARTIFACT_DIR/report.md"
          cat "$ARTIFACT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish public profile check
        if: ${{ always() && steps.report.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_BUILD_OUTCOME: ${{ steps.build_profile.outcome }}
          PROFILE_SYMBOLS_OUTCOME: ${{ steps.symbols.outcome }}
          PROFILE_XCTRACE_OUTCOME: ${{ steps.time_profiler.outcome }}
          PROFILE_TRACE_ANALYSIS_OUTCOME: ${{ steps.trace_analysis.outcome }}
        run: |
          set -euo pipefail
          conclusion=neutral
          if [ "$PROFILE_BUILD_OUTCOME" = success ] \
            && [ "$PROFILE_SYMBOLS_OUTCOME" = success ] \
            && [ "$PROFILE_XCTRACE_OUTCOME" = success ] \
            && [ "$PROFILE_TRACE_ANALYSIS_OUTCOME" = success ]; then
            conclusion=success
          fi
          export PROFILE_CHECK_CONCLUSION="$conclusion"
          ruby -rjson -e '
            summary = File.read(ARGV.fetch(0), encoding: "UTF-8")
              .byteslice(0, 60_000).to_s.scrub
            payload = {
              name: "Thread scroll profile report (iOS 18.5 Simulator)",
              head_sha: ENV.fetch("GITHUB_SHA"),
              status: "completed",
              conclusion: ENV.fetch("PROFILE_CHECK_CONCLUSION"),
              details_url: "https://github.com/#{ENV.fetch("GITHUB_REPOSITORY")}/actions/runs/#{ENV.fetch("GITHUB_RUN_ID")}",
              external_id: "#{ENV.fetch("GITHUB_RUN_ID")}-#{ENV.fetch("GITHUB_RUN_ATTEMPT")}",
              output: {
                title: "Deterministic thread scrolling profile",
                summary: summary,
              },
            }
            File.write(ARGV.fetch(1), JSON.generate(payload))
          ' "$ARTIFACT_DIR/report.md" "$ARTIFACT_DIR/check-payload.json"
          curl \
            --fail-with-body \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
            --data-binary "@$ARTIFACT_DIR/check-payload.json"

      - name: Upload profile artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thread-scroll-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          retention-days: 14
          if-no-files-found: error

      - name: Fail when required profiling stages fail
        if: >-
          ${{ always() &&
          (steps.build_profile.outcome != 'success' ||
          steps.symbols.outcome != 'success' ||
          steps.time_profiler.outcome != 'success' ||
          steps.trace_analysis.outcome != 'success') }}
        run: exit 1
