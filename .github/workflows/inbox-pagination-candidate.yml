name: Inbox pagination candidate
on:
  push:
    branches: [ci/inbox-pagination-1004]
permissions:
  contents: read
jobs:
  inbox-pagination:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Select iPhone simulator
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available -j | jq -r '
            [.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] as $phones
            | (($phones | map(select(.name == "iPhone 16 Pro"))) + $phones | .[0].udid // empty)
          ')"
          test -n "$device_id"
          echo "CANDIDATE_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
      - name: Test inbox pagination and retained reading positions
        id: ui
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlusIconsUI \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination "$CANDIDATE_DESTINATION" -parallel-testing-enabled NO \
            -only-testing:TiebaPlusPlusUITests/InboxScopesUITests \
            -resultBundlePath inbox-ui-results.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee inbox-ui-test.log
      - name: Export actual results
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path inbox-ui-results.xcresult --compact > inbox-ui-summary.json
          xcrun xcresulttool export attachments --path inbox-ui-results.xcresult --output-path inbox-ui-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-pagination-candidate
          path: |
            inbox-ui-test.log
            inbox-ui-summary.json
            inbox-ui-attachments/
      - name: Enforce validation
        if: ${{ always() && steps.ui.outcome != 'success' }}
        run: exit 1
