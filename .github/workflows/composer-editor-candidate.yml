name: Composer inline emoticon candidate
on:
  push:
    branches: [feat/composer-inline-1013]
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Create simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable and .version == "18.5") | .identifier' | head -1)"
          test -n "$runtime"
          simulator="$(xcrun simctl create "Composer candidate $GITHUB_RUN_ID" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$runtime")"
          echo "COMPOSER_SIMULATOR=$simulator" >> "$GITHUB_ENV"
      - name: Test production editor and source contracts
        id: native
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlus \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,id=$COMPOSER_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath composer-results.xcresult \
            -only-testing:TiebaPlusPlusTests/ComposerEmoticonSpansTests \
            -only-testing:TiebaPlusPlusTests/ComposerEmoticonTextViewTests \
            -only-testing:TiebaPlusPlusTests/ComposerTextEditorNativeTests \
            -only-testing:TiebaPlusPlusTests/ComposerTextEditorTests \
            -only-testing:TiebaPlusPlusTests/ClassicEmoticonPickerTests \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO test 2>&1 | tee composer-test.log
      - name: Export native evidence
        if: always()
        run: |
          if [ -d composer-results.xcresult ]; then
            xcrun xcresulttool get test-results summary --path composer-results.xcresult > composer-summary.json
            xcrun xcresulttool export attachments --path composer-results.xcresult --output-path composer-attachments
          fi
      - name: Test actual composer picker and file draft restoration
        id: ui
        if: ${{ steps.native.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlusIconsUI \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination "platform=iOS Simulator,id=$COMPOSER_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath composer-ui-results.xcresult \
            -only-testing:TiebaPlusPlusUITests/ComposerEmoticonUITests \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO test 2>&1 | tee composer-ui-test.log
      - name: Export composer UI evidence
        if: always()
        run: |
          if [ -d composer-ui-results.xcresult ]; then
            xcrun xcresulttool get test-results summary --path composer-ui-results.xcresult > composer-ui-summary.json
            xcrun xcresulttool export attachments --path composer-ui-results.xcresult --output-path composer-ui-attachments
          fi
      - name: Export failed UI process diagnostics
        if: ${{ always() && steps.ui.outcome == 'failure' }}
        run: |
          if [ -d composer-ui-results.xcresult ]; then
            xcrun xcresulttool export diagnostics --path composer-ui-results.xcresult --output-path composer-ui-diagnostics
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composer-candidate-${{ github.run_id }}
          path: |
            composer-test.log
            composer-summary.json
            composer-attachments/
            composer-ui-test.log
            composer-ui-summary.json
            composer-ui-attachments/
            composer-ui-diagnostics/
          retention-days: 7
      - name: Delete simulator
        if: ${{ always() && env.COMPOSER_SIMULATOR != '' }}
        run: |
          xcrun simctl shutdown "$COMPOSER_SIMULATOR" || true
          xcrun simctl delete "$COMPOSER_SIMULATOR"
      - name: Enforce native result
        if: ${{ always() && (steps.native.outcome != 'success' || steps.ui.outcome != 'success') }}
        run: exit 1
