name: Inbox filtered pagination candidate

on:
  push:
    branches: [ci/inbox-filtered-pagination-1004]

permissions:
  contents: read

jobs:
  inbox-filtered-pagination:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Create clean iPhone 16 Pro on iOS 18.5
        run: |
          set -euo pipefail
          runtime_id=com.apple.CoreSimulator.SimRuntime.iOS-18-5
          xcrun simctl list runtimes -j | jq -e --arg runtime "$runtime_id" \
            'any(.runtimes[]; .identifier == $runtime and .isAvailable == true)'
          device_id="$(xcrun simctl create "Tieba filtered inbox $GITHUB_RUN_ID" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$runtime_id")"
          echo "CANDIDATE_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          echo "CANDIDATE_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Test retained inbox scopes and filtered page continuation
        id: ui
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlusIconsUI \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination "$CANDIDATE_DESTINATION" -parallel-testing-enabled NO \
            -only-testing:TiebaPlusPlusUITests/InboxScopesUITests \
            -only-testing:TiebaPlusPlusUITests/InboxFilteredPaginationUITests \
            -resultBundlePath inbox-filtered-ui-results.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee inbox-filtered-ui-test.log
      - name: Report compiler and UI diagnostics
        if: ${{ always() && steps.ui.outcome == 'failure' }}
        run: >-
          ruby Scripts/report_xcode_errors.rb
          --mode full
          --title "Inbox filtered pagination candidate failed"
          --file App/UITests/InboxFilteredPaginationUITests.swift
          inbox-filtered-ui-test.log
      - name: Export actual test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary \
            --path inbox-filtered-ui-results.xcresult --compact > inbox-filtered-ui-summary.json
      - name: Export test attachments
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path inbox-filtered-ui-results.xcresult --output-path inbox-filtered-ui-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-filtered-pagination-candidate
          path: |
            inbox-filtered-ui-test.log
            inbox-filtered-ui-summary.json
            inbox-filtered-ui-attachments/
      - name: Require exactly four passing UI tests
        if: always()
        env:
          UI_OUTCOME: ${{ steps.ui.outcome }}
        run: |
          ruby -rjson -e '
            abort "The native UI command failed" unless ENV.fetch("UI_OUTCOME") == "success"
            summary = JSON.parse(File.read("inbox-filtered-ui-summary.json"))
            expected = {"result" => "Passed", "totalTestCount" => 4, "passedTests" => 4,
              "failedTests" => 0, "skippedTests" => 0, "expectedFailures" => 0}
            expected.each do |key, value|
              abort "#{key}: expected #{value.inspect}, got #{summary[key].inspect}" unless summary[key] == value
            end
            puts "Verified all four UI tests passed without skips or expected failures."
          '
      - name: Remove candidate simulator
        if: ${{ always() && env.CANDIDATE_DEVICE_ID != '' }}
        run: |
          xcrun simctl shutdown "$CANDIDATE_DEVICE_ID" || true
          xcrun simctl delete "$CANDIDATE_DEVICE_ID"
