name: Stop regressed alpha46 candidate

on:
  push:
    branches: [ci/cancel-alpha46-1004]

permissions:
  contents: read
  actions: write

jobs:
  cancel-exact-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and stop only the regressed alpha46 candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: Minaduki-Shigure/tieba-plus-plus-swift
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const repository = process.env.EXPECTED_REPOSITORY;
          const targetID = 37190889950;
          const targetSHA = '659db3cb22ddb89bc0bf7476c0a9cff6a11c4e7c';
          const targetTag = 'v0.65.0-alpha.46';
          const active = new Set(['queued', 'in_progress']);
          const evidence = [];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function request(path, method = 'GET') {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              method,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });
            if (!response.ok) {
              throw new Error(`${method} ${path}: HTTP ${response.status}; no automatic retry`);
            }
            const body = await response.text();
            return body ? JSON.parse(body) : null;
          }
          function assertRepositoryAndSHA(run) {
            if (run.repository?.full_name !== repository
                || run.head_repository?.full_name !== repository
                || run.head_sha !== targetSHA) {
              throw new Error(`Run ${run.id} has an unexpected repository or SHA; refusing mutation`);
            }
          }
          function assertTarget(run) {
            assertRepositoryAndSHA(run);
            if (run.id !== targetID || run.name !== 'CI' || run.workflow_id !== 325041245
                || run.head_branch !== targetTag || run.event !== 'push') {
              throw new Error('Target CI identity mismatch; refusing mutation');
            }
          }
          function record(run, action) {
            const row = { id: run.id, name: run.name, headSHA: run.head_sha,
              branch: run.head_branch, event: run.event, status: run.status,
              conclusion: run.conclusion, action };
            evidence.push(row);
            console.log(JSON.stringify(row));
          }
          try {
            let target = await request(`actions/runs/${targetID}`);
            assertTarget(target);
            record(target, 'verified');
            if (active.has(target.status)) {
              await request(`actions/runs/${targetID}/cancel`, 'POST');
              record(target, 'cancel accepted');
              for (let attempt = 0; attempt < 30; attempt++) {
                await sleep(2000);
                target = await request(`actions/runs/${targetID}`);
                assertTarget(target);
                if (target.status === 'completed') break;
              }
            }
            record(target, 'after cancellation check');
            if (target.status !== 'completed') {
              throw new Error('Target did not reach a terminal state; inspect manually, no repeated cancellation');
            }

            // A success/cancel race could already have scheduled the exact-SHA
            // IPA workflow. This helper never touches any other commit or name.
            const cancelledBuilds = new Set();
            for (let attempt = 0; attempt < 6; attempt++) {
              const runs = await request(`actions/workflows/build-ipa.yml/runs?head_sha=${targetSHA}&event=workflow_run&per_page=100`);
              for (const run of runs.workflow_runs ?? []) {
                assertRepositoryAndSHA(run);
                if (run.name !== 'Build unsigned IPA' || run.event !== 'workflow_run') {
                  throw new Error(`Unexpected downstream run ${run.id}; refusing mutation`);
                }
                if (active.has(run.status) && !cancelledBuilds.has(run.id)) {
                  // Re-fetch immediately before writing to confirm exact scope.
                  const current = await request(`actions/runs/${run.id}`);
                  assertRepositoryAndSHA(current);
                  if (current.name !== 'Build unsigned IPA' || current.event !== 'workflow_run') {
                    throw new Error('Downstream identity changed; refusing mutation');
                  }
                  if (active.has(current.status)) {
                    await request(`actions/runs/${current.id}/cancel`, 'POST');
                    cancelledBuilds.add(current.id);
                    record(current, 'downstream cancel accepted');
                  } else {
                    record(current, 'downstream already terminal');
                  }
                } else {
                  record(run, 'downstream inspected without mutation');
                }
              }
              if (attempt < 5) await sleep(5000);
            }
            if (cancelledBuilds.size === 0) console.log('No active exact-SHA downstream IPA build required cancellation.');
          } finally {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '# Alpha46 cancellation evidence\n\nReason: native filtered-inbox pagination position regression.\n\n'
              + '```json\n' + JSON.stringify(evidence, null, 2) + '\n```\n');
          }
          NODE
