name: Read failed build diagnostics

on:
  push:
    tags: [diagnose-alpha20-build*]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read failed iOS build log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/artifacts/11094314231/zip" > "$RUNNER_TEMP/failed-build.zip" 2> "$RUNNER_TEMP/diagnostic-error.log"; then
            ruby Scripts/report_xcode_errors.rb --mode full --title "Log download failure" "$RUNNER_TEMP/diagnostic-error.log"
            exit 1
          fi
          unzip -p "$RUNNER_TEMP/failed-build.zip" xcodebuild.log > "$RUNNER_TEMP/failed-build.log"
          ruby -e '
            lines = File.binread(ARGV[0]).force_encoding("UTF-8").scrub.lines
            pattern = /Stack dump|PLEASE submit|while (?:evaluating|lowering|running|generating|type-checking)|Assertion|Segmentation|LLVM ERROR|signal \d|Command.*failed|LLVM Profile Error/i
            indices = lines.each_index.select { |index| pattern.match?(lines[index]) }
            selected = indices.flat_map { |index| (([0, index - 4].max)..([lines.length - 1, index + 18].min)).to_a }.uniq
            selected.each { |index| puts "#{index + 1}: #{lines[index]}" }
          ' "$RUNNER_TEMP/failed-build.log" > "$RUNNER_TEMP/compiler-context.log"
          ruby Scripts/report_xcode_errors.rb --mode full --title "Compiler failure context" "$RUNNER_TEMP/compiler-context.log"
          if ! ruby Scripts/report_xcode_errors.rb "$RUNNER_TEMP/failed-build.log" 2> "$RUNNER_TEMP/diagnostic-error.log"; then
            ruby Scripts/report_xcode_errors.rb --mode full --title "Diagnostic parser failure" "$RUNNER_TEMP/diagnostic-error.log"
            exit 1
          fi
