name: Build unsigned IPA

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  # workflow_run also fires for non-release CI; only tag pushes share the release queue.
  group: >-
    ${{ github.event.workflow_run.event == 'push' &&
    startsWith(github.event.workflow_run.head_branch, 'v') && 'release-main' ||
    format('release-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  build:
    name: Build tested IPA
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v') }}
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      IPA_PATH: build/TiebaPlusPlus-SideStore.ipa
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
      - name: Verify release tag and version
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "$tag_ref"
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${tag_ref}^{commit}")"
          if [ "$head_sha" != "$RELEASE_SHA" ] || [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "Tag, checkout, and tested commit do not resolve to $RELEASE_SHA" >&2
            exit 1
          fi

          marketing_version="$(ruby -ryaml -e '
            project = YAML.safe_load_file("project.yml")
            puts project.dig("targets", "TiebaPlusPlus", "settings", "base", "MARKETING_VERSION")
          ')"
          tag_version="${RELEASE_TAG#v}"
          if [ "${tag_version%%-*}" != "$marketing_version" ]; then
            echo "Tag $RELEASE_TAG does not match MARKETING_VERSION $marketing_version" >&2
            exit 1
          fi
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen_version="$(xcodegen --version | awk '{print $NF}')"
          ruby -rrubygems -e '
            abort "XcodeGen #{ARGV[0]} is older than 2.45.4" if
              Gem::Version.new(ARGV[0]) < Gem::Version.new("2.45.4")
          ' "$xcodegen_version"
      - name: Generate project
        run: xcodegen generate
      - name: Archive unsigned app
        run: >-
          xcodebuild
          -project TiebaPlusPlus.xcodeproj
          -scheme TiebaPlusPlus
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/TiebaPlusPlus.xcarchive
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          archive
      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/TiebaPlusPlus.xcarchive/Products/Applications/TiebaPlusPlus.app build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload TiebaPlusPlus-SideStore.ipa
      - name: Verify unsigned IPA
        run: |
          set -euo pipefail
          app_path="build/Payload/TiebaPlusPlus.app"
          info_plist="$app_path/Info.plist"
          entries_file="$(mktemp)"
          test -f "$IPA_PATH"
          test -f "$info_plist"
          plutil -lint "$info_plist"
          unzip -tq "$IPA_PATH"
          unzip -Z1 "$IPA_PATH" > "$entries_file"

          if find "$app_path" \( -name _CodeSignature -o -name CodeResources \) \
            -print -quit | grep -q .; then
            echo "Unsigned archive unexpectedly contains signing metadata" >&2
            exit 1
          fi
          if grep -Eq '(^/|(^|/)\.\.(/|$))' "$entries_file"; then
            echo "IPA contains an unsafe archive path" >&2
            exit 1
          fi
          if grep -Eq '(^|/)(_CodeSignature|CodeResources)(/|$)' "$entries_file"; then
            echo "IPA unexpectedly contains signing metadata" >&2
            exit 1
          fi
          if [ "$(grep -Ec '^Payload/[^/]+\.app/Info\.plist$' "$entries_file")" -ne 1 ]; then
            echo "IPA must contain exactly one top-level application" >&2
            exit 1
          fi

          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$info_plist")"
          marketing_version="$(plutil -extract CFBundleShortVersionString raw -o - "$info_plist")"
          build_version="$(plutil -extract CFBundleVersion raw -o - "$info_plist")"
          expected_build="$(ruby -ryaml -e '
            project = YAML.safe_load_file("project.yml")
            puts project.dig("targets", "TiebaPlusPlus", "settings", "base", "CURRENT_PROJECT_VERSION")
          ')"

          test "$bundle_id" = "io.github.minaduki.tieba-plus-plus"
          test "v${marketing_version}" = "${RELEASE_TAG%%-*}"
          test "$build_version" = "$expected_build"

          ipa_size="$(stat -f '%z' "$IPA_PATH")"
          ipa_sha256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          {
            echo "### Unsigned IPA build"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Version: \`$marketing_version ($build_version)\`"
            echo "- Size: \`$ipa_size\` bytes"
            echo "- SHA-256: \`$ipa_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TiebaPlusPlus-SideStore-${{ env.RELEASE_TAG }}
          path: ${{ env.IPA_PATH }}
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish tested IPA
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      IPA_PATH: build/TiebaPlusPlus-SideStore.ipa
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: TiebaPlusPlus-SideStore-${{ env.RELEASE_TAG }}
          path: build
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
          path: release-source
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main
          path: source-update
      - name: Prepare atomic source handoff
        run: >-
          ruby release-source/Scripts/release_source_handoff.rb
          prepare
          --repository source-update
          --release-sha "$RELEASE_SHA"
          --release-tag "$RELEASE_TAG"
      - name: Verify release target and asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error file=.github/workflows/build-ipa.yml::Release command failed at shell line $LINENO: $BASH_COMMAND (exit $status)"; exit "$status"' ERR
          asset_name="$(basename "$IPA_PATH")"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          test -f "$IPA_PATH"

          tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          tag_type="$(jq -r '.object.type' <<< "$tag_json")"
          tag_sha="$(jq -r '.object.sha' <<< "$tag_json")"
          dereference_count=0
          while [ "$tag_type" = "tag" ]; do
            dereference_count=$((dereference_count + 1))
            if [ "$dereference_count" -gt 5 ]; then
              echo "Release tag nesting exceeds the supported limit" >&2
              exit 1
            fi
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
            tag_type="$(jq -r '.object.type' <<< "$tag_json")"
            tag_sha="$(jq -r '.object.sha' <<< "$tag_json")"
          done
          if [ "$tag_type" != "commit" ] || [ "$tag_sha" != "$RELEASE_SHA" ]; then
            echo "Remote tag no longer resolves to tested commit $RELEASE_SHA" >&2
            exit 1
          fi

          ipa_size="$(stat -c '%s' "$IPA_PATH")"
          ipa_sha256="$(sha256sum "$IPA_PATH" | awk '{print $1}')"
          expected_digest="sha256:$ipa_sha256"
          expected_prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            expected_prerelease=true
          fi

          verify_asset() {
            local release_json="$1"
            local asset_count asset_id asset_size asset_state asset_digest downloaded_asset
            asset_count="$(jq --arg name "$asset_name" '[.assets[] | select(.name == $name)] | length' <<< "$release_json")"
            if [ "$asset_count" -ne 1 ] || [ "$(jq '.assets | length' <<< "$release_json")" -ne 1 ]; then
              echo "Release must contain exactly one $asset_name asset" >&2
              return 1
            fi
            asset_id="$(jq --arg name "$asset_name" -r '.assets[] | select(.name == $name) | .id' <<< "$release_json")"
            asset_size="$(jq --arg name "$asset_name" -r '.assets[] | select(.name == $name) | .size' <<< "$release_json")"
            asset_state="$(jq --arg name "$asset_name" -r '.assets[] | select(.name == $name) | .state' <<< "$release_json")"
            asset_digest="$(jq --arg name "$asset_name" -r '.assets[] | select(.name == $name) | .digest // empty' <<< "$release_json")"
            if [ "$asset_state" != "uploaded" ]; then
              echo "Release asset state is $asset_state instead of uploaded" >&2
              return 1
            fi
            if [ "$asset_size" != "$ipa_size" ]; then
              echo "Release asset size $asset_size does not match built IPA size $ipa_size" >&2
              return 1
            fi
            if [ -z "$asset_digest" ]; then
              downloaded_asset="$(mktemp)"
              gh api \
                -H 'Accept: application/octet-stream' \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$downloaded_asset"
              asset_digest="sha256:$(sha256sum "$downloaded_asset" | awk '{print $1}')"
            fi
            if [ "$asset_digest" != "$expected_digest" ]; then
              echo "Release asset digest $asset_digest does not match $expected_digest" >&2
              return 1
            fi
          }

          load_release_matches() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
              jq -s --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)]'
          }

          release_json=""
          release_matches="$(load_release_matches)"
          release_count="$(jq 'length' <<< "$release_matches")"
          if [ "$release_count" -gt 1 ]; then
            echo "Multiple releases unexpectedly use tag $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$release_count" -eq 1 ]; then
            release_json="$(jq '.[0]' <<< "$release_matches")"
            if [ "$(jq -r '.tag_name' <<< "$release_json")" != "$RELEASE_TAG" ]; then
              echo "Existing release has an unexpected tag" >&2
              exit 1
            fi
            if [ "$(jq -r '.prerelease' <<< "$release_json")" != "$expected_prerelease" ]; then
              echo "Existing release has an unexpected prerelease state" >&2
              exit 1
            fi
            if [ "$(jq -r '.draft' <<< "$release_json")" = "false" ]; then
              verify_asset "$release_json"
              echo "Release $RELEASE_TAG is already published with the expected IPA."
              exit 0
            fi
          else
            echo "Creating draft release for $RELEASE_TAG"
            release_json="$(gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$RELEASE_SHA" \
              -f name="Tieba++ $RELEASE_TAG" \
              -f body='Unsigned IPA for SideStore or LiveContainer self-signing. See README for supported features and security boundaries.' \
              -F draft=true \
              -F prerelease="$expected_prerelease")"
          fi

          release_id="$(jq -r '.id' <<< "$release_json")"
          if [[ ! "$release_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release API did not return a valid release ID" >&2
            exit 1
          fi

          asset_total="$(jq '.assets | length' <<< "$release_json")"
          if [ "$asset_total" -eq 1 ] && \
             [ "$(jq -r '.assets[0].name' <<< "$release_json")" = "$asset_name" ] && \
             [ "$(jq -r '.assets[0].state' <<< "$release_json")" = "starter" ]; then
            incomplete_asset_id="$(jq -r '.assets[0].id' <<< "$release_json")"
            echo "Removing incomplete release asset $incomplete_asset_id before retry"
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$incomplete_asset_id"
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
            asset_total="$(jq '.assets | length' <<< "$release_json")"
          fi
          if [ "$asset_total" -eq 0 ]; then
            echo "Uploading $asset_name to draft release $release_id"
            upload_url="$(jq -r '.upload_url | sub("\\{.*$"; "")' <<< "$release_json")"
            expected_upload_url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets"
            if [ "$upload_url" != "$expected_upload_url" ]; then
              echo "Release API returned an unexpected upload URL" >&2
              exit 1
            fi
            gh api \
              --method POST \
              -H 'Content-Type: application/octet-stream' \
              --input "$IPA_PATH" \
              "${upload_url}?name=${asset_name}" >/dev/null
          else
            verify_asset "$release_json"
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          verify_asset "$release_json"
          if [ "$(jq -r '.draft' <<< "$release_json")" != "true" ] || \
             [ "$(jq -r '.prerelease' <<< "$release_json")" != "$expected_prerelease" ]; then
            echo "Release state does not match the requested channel" >&2
            exit 1
          fi
          echo "Publishing verified draft release $release_id"
          release_json="$(gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false)"
          if [ "$(jq -r '.draft' <<< "$release_json")" != "false" ]; then
            echo "Release $release_id remained a draft after publishing" >&2
            exit 1
          fi
          verify_asset "$release_json"

          {
            echo "### Published unsigned IPA"
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Size: \`$ipa_size\` bytes"
            echo "- SHA-256: \`$ipa_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish app source metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error file=sidestore-source.json::Source publication failed at shell line $LINENO: $BASH_COMMAND (exit $status)"; exit "$status"' ERR
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          release_date="$(jq -r '.published_at[0:10]' <<< "$release_json")"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Release API returned an invalid publication date" >&2
            exit 1
          fi
          description="Tieba++ $RELEASE_TAG 已通过核心测试、iOS 模拟器测试、匿名集成门禁和 IPA 完整性检查。此版本为无签名 IPA，供 SideStore 或 LiveContainer 自签名安装；详细功能与安全边界请参阅仓库文档。"

          ruby release-source/Scripts/update_sidestore_source.rb \
            --source source-update/sidestore-source.json \
            --project release-source/project.yml \
            --ipa "$IPA_PATH" \
            --tag "$RELEASE_TAG" \
            --date "$release_date" \
            --description "$description"
          ruby release-source/Scripts/validate_sidestore_source.rb \
            --source source-update/sidestore-source.json \
            --project release-source/project.yml \
            --ipa "$IPA_PATH"
          ruby release-source/Scripts/validate_sidestore_source.rb \
            --source source-update/sidestore-source.json \
            --project source-update/project.yml \
            --ipa "$IPA_PATH"

          git -C source-update config user.name github-actions[bot]
          git -C source-update config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C source-update add sidestore-source.json
          if git -C source-update diff --cached --quiet; then
            echo "App source already contains $RELEASE_TAG."
          else
            staged_paths="$(git -C source-update diff --cached --name-only)"
            if [ "$staged_paths" != "sidestore-source.json" ]; then
              echo "Source publication unexpectedly staged: $staged_paths" >&2
              exit 1
            fi
            git -C source-update diff --cached --check
            git -C source-update commit -m "chore: publish $RELEASE_TAG app source"
          fi

          ruby release-source/Scripts/release_source_handoff.rb \
            publish \
            --repository source-update \
            --release-sha "$RELEASE_SHA" \
            --release-tag "$RELEASE_TAG" \
            --attempts 3
