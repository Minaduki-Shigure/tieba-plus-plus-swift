name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: Run the anonymous Tieba integration flow
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    name: App source validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate source metadata
        run: ruby Scripts/validate_sidestore_source.rb
      - name: Verify published IPA
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          download_url="$(ruby -rjson -e '
            source = JSON.parse(File.read("sidestore-source.json"))
            puts source.dig("apps", 0, "versions", 0, "downloadURL")
          ')"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --tlsv1.2 \
            "$download_url" \
            --output /tmp/TiebaPlusPlus-SideStore.ipa
          ruby Scripts/validate_sidestore_source.rb \
            --ipa /tmp/TiebaPlusPlus-SideStore.ipa

  core-tests:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve and test TiebaCore
        id: core_tests
        continue-on-error: true
        run: >-
          set -o pipefail;
          swift test --package-path Packages/TiebaCore
          2>&1 | tee core-test.log
      - name: Report Core diagnostics
        if: ${{ always() && steps.core_tests.outcome == 'failure' }}
        run: ruby Scripts/report_xcode_errors.rb core-test.log
      - name: Upload Core failure log
        if: ${{ always() && steps.core_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: core-test.log
          retention-days: 7
      - name: Fail when Core tests fail
        if: ${{ always() && steps.core_tests.outcome == 'failure' }}
        run: exit 1
      - name: Run anonymous integration test for release or opt-in dispatch
        id: live_tests
        continue-on-error: true
        if: >-
          ${{ startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.run_live_tests) }}
        env:
          TIEBA_LIVE_TESTS: "1"
        run: >-
          set -o pipefail;
          swift test --package-path Packages/TiebaCore --filter TiebaLiveTests
          2>&1 | tee live-test.log
      - name: Report live-test diagnostics
        if: ${{ always() && steps.live_tests.outcome == 'failure' }}
        run: ruby Scripts/report_xcode_errors.rb live-test.log
      - name: Upload live-test failure log
        if: ${{ always() && steps.live_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-test.log
          retention-days: 7
      - name: Fail when live tests fail
        if: ${{ always() && steps.live_tests.outcome == 'failure' }}
        run: exit 1

  app-tests:
    name: iOS app tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select available iOS simulator
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            device_id="$(xcrun simctl list devices available -j | jq -r '
              [.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] as $phones
              | (($phones | map(select(.name == "iPhone 16 Pro"))) + $phones
              | .[0].udid // empty)
            ')"
            if [ -n "$device_id" ]; then
              echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
              exit 0
            fi
            killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep 5
          done
          xcrun simctl list runtimes
          xcrun simctl list devices available
          exit 1
      - name: Build and test app
        id: app_tests
        continue-on-error: true
        run: >-
          set -o pipefail;
          xcodebuild
          -project TiebaPlusPlus.xcodeproj
          -scheme TiebaPlusPlus
          -configuration Debug
          -destination "$IOS_SIMULATOR_DESTINATION"
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          test 2>&1 | tee xcodebuild.log
      - name: Report Xcode diagnostics
        if: ${{ always() && steps.app_tests.outcome == 'failure' }}
        run: ruby Scripts/report_xcode_errors.rb xcodebuild.log
      - name: Upload Xcode failure log
        if: ${{ always() && steps.app_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: xcodebuild.log
          retention-days: 7
      - name: Fail when app tests fail
        if: ${{ always() && steps.app_tests.outcome == 'failure' }}
        run: exit 1
