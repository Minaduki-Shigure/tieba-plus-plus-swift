name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: Run the anonymous Tieba integration flow
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve and test TiebaCore
        run: swift test --package-path Packages/TiebaCore
      - name: Run opt-in anonymous integration test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_tests }}
        env:
          TIEBA_LIVE_TESTS: "1"
        run: swift test --package-path Packages/TiebaCore --filter TiebaLiveTests

  app-tests:
    name: iOS app tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select available iOS simulator
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            device_id="$(xcrun simctl list devices available -j | jq -r '
              [.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] as $phones
              | (($phones | map(select(.name == "iPhone 16 Pro"))) + $phones
              | .[0].udid // empty)
            ')"
            if [ -n "$device_id" ]; then
              echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
              exit 0
            fi
            killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep 5
          done
          xcrun simctl list runtimes
          xcrun simctl list devices available
          exit 1
      - name: Build and test app
        id: app_tests
        continue-on-error: true
        run: >-
          set -o pipefail;
          xcodebuild
          -project TiebaPlusPlus.xcodeproj
          -scheme TiebaPlusPlus
          -configuration Debug
          -destination "$IOS_SIMULATOR_DESTINATION"
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          test 2>&1 | tee xcodebuild.log
      - name: Report Xcode diagnostics
        if: steps.app_tests.outcome == 'failure'
        run: ruby Scripts/report_xcode_errors.rb xcodebuild.log
