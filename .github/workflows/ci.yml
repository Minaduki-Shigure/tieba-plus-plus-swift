name: CI

on:
  push:
    branches: [main, ci/nested-reply-deletion-1003]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: Run the anonymous Tieba integration flow
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-publication-tooling:
    name: App source publication tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Test failure diagnostic reporting
        run: ruby Scripts/test_report_xcode_errors.rb
      - name: Test source publication tooling
        id: source_tests
        continue-on-error: true
        run: >-
          set -o pipefail;
          ruby Scripts/test_update_sidestore_source.rb
          2>&1 | tee source-test.log
      - name: Report source-test diagnostics
        if: ${{ always() && steps.source_tests.outcome == 'failure' }}
        run: >-
          ruby Scripts/report_xcode_errors.rb
          --mode full
          --title "Source publication tooling tests failed"
          --file Scripts/test_update_sidestore_source.rb
          source-test.log
      - name: Upload source-test failure log
        if: ${{ always() && steps.source_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: source-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-test.log
          retention-days: 7
      - name: Fail when source publication tests fail
        if: ${{ always() && steps.source_tests.outcome == 'failure' }}
        run: exit 1

  source-validation:
    name: App source validation
    # A tag intentionally retains the previous source until its release asset exists.
    if: ${{ github.ref_type != 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate source metadata
        run: ruby Scripts/validate_sidestore_source.rb
      - name: Verify published IPA
        if: >-
          ${{ github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          download_url="$(ruby -rjson -e '
            source = JSON.parse(File.read("sidestore-source.json"))
            puts source.dig("apps", 0, "versions", 0, "downloadURL")
          ')"
          curl \
            --fail \
            --location \
            --proto '=https' \
            --retry 3 \
            --tlsv1.2 \
            "$download_url" \
            --output /tmp/TiebaPlusPlus-SideStore.ipa
          ruby Scripts/validate_sidestore_source.rb \
            --ipa /tmp/TiebaPlusPlus-SideStore.ipa

  core-tests:
    name: Core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Resolve and test TiebaCore
        id: core_tests
        continue-on-error: true
        run: >-
          set -o pipefail;
          swift test --package-path Packages/TiebaCore
          2>&1 | tee core-test.log
      - name: Report Core diagnostics
        if: ${{ always() && steps.core_tests.outcome == 'failure' }}
        run: ruby Scripts/report_xcode_errors.rb core-test.log
      - name: Upload Core failure log
        if: ${{ always() && steps.core_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: core-test.log
          retention-days: 7
      - name: Fail when Core tests fail
        if: ${{ always() && steps.core_tests.outcome == 'failure' }}
        run: exit 1
      - name: Run anonymous integration test for release or opt-in dispatch
        id: live_tests
        continue-on-error: true
        if: >-
          ${{ startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.run_live_tests) }}
        env:
          TIEBA_LIVE_TESTS: "1"
        run: >-
          set -o pipefail;
          swift test --package-path Packages/TiebaCore --filter TiebaLiveTests
          2>&1 | tee live-test.log
      - name: Report live-test diagnostics
        if: ${{ always() && steps.live_tests.outcome == 'failure' }}
        run: ruby Scripts/report_xcode_errors.rb live-test.log
      - name: Upload live-test failure log
        if: ${{ always() && steps.live_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-test.log
          retention-days: 7
      - name: Fail when live tests fail
        if: ${{ always() && steps.live_tests.outcome == 'failure' }}
        run: exit 1

  app-tests:
    name: iOS app tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select available iOS simulator
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            device_id="$(xcrun simctl list devices available -j | jq -r '
              [.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] as $phones
              | (($phones | map(select(.name == "iPhone 16 Pro"))) + $phones
              | .[0].udid // empty)
            ')"
            if [ -n "$device_id" ]; then
              echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
              exit 0
            fi
            killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep 5
          done
          xcrun simctl list runtimes
          xcrun simctl list devices available
          exit 1
      - name: Build and test app
        id: app_tests
        continue-on-error: true
        run: >-
          set -o pipefail;
          xcodebuild
          -project TiebaPlusPlus.xcodeproj
          -scheme TiebaPlusPlus
          -configuration Debug
          -derivedDataPath build/DerivedData
          -resultBundlePath app-test-results.xcresult
          -destination "$IOS_SIMULATOR_DESTINATION"
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          test 2>&1 | tee xcodebuild.log
      - name: Report Xcode diagnostics
        if: ${{ always() && steps.app_tests.outcome == 'failure' }}
        run: ruby Scripts/report_xcode_errors.rb xcodebuild.log
      - name: Export app test attachments
        if: ${{ always() && (steps.app_tests.outcome == 'success' || steps.app_tests.outcome == 'failure') }}
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments \
            --path app-test-results.xcresult \
            --output-path app-test-attachments
          xcrun xcresulttool get test-results summary \
            --path app-test-results.xcresult --compact > app-test-summary.json
      - name: Upload app test results
        if: ${{ always() && (steps.app_tests.outcome == 'success' || steps.app_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app-test-results.xcresult
            app-test-attachments/
            app-test-summary.json
          retention-days: 7
      - name: Upload Xcode failure log
        if: ${{ always() && steps.app_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: xcodebuild.log
          retention-days: 7
      - name: Verify compiled app icon assets
        id: icon_assets
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun assetutil --info build/DerivedData/Build/Products/Debug-iphonesimulator/TiebaPlusPlus.app/Assets.car > icon-assets.json
          ruby Scripts/validate_compiled_app_icons.rb icon-assets.json
      - name: Create clean simulator for UI tests
        run: |
          set -euo pipefail
          selected_device="${IOS_SIMULATOR_DESTINATION##*id=}"
          read -r icon_device_type icon_runtime < <(
            xcrun simctl list devices available -j | jq -r --arg id "$selected_device" '
              .devices | to_entries[] | .key as $runtime | .value[]
              | select(.udid == $id) | [.deviceTypeIdentifier, $runtime] | @tsv
            '
          )
          test -n "$icon_device_type"
          test -n "$icon_runtime"
          icon_device_id="$(xcrun simctl create "Tieba icon UI $GITHUB_RUN_ID" "$icon_device_type" "$icon_runtime")"
          echo "ICON_UI_SIMULATOR_ID=$icon_device_id" >> "$GITHUB_ENV"
          echo "ICON_UI_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$icon_device_id" >> "$GITHUB_ENV"
      - name: Test app icon and wallpaper workflows
        id: icon_ui_tests
        continue-on-error: true
        run: >-
          set -o pipefail;
          xcodebuild
          -project TiebaPlusPlus.xcodeproj
          -scheme TiebaPlusPlusIconsUI
          -configuration Debug
          -derivedDataPath build/DerivedData
          -enableCodeCoverage YES
          -destination "$ICON_UI_SIMULATOR_DESTINATION"
          -parallel-testing-enabled NO
          -resultBundlePath icon-ui-results.xcresult
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
          test 2>&1 | tee icon-ui-test.log
      - name: Report UI diagnostics
        if: ${{ always() && steps.icon_ui_tests.outcome == 'failure' }}
        run: ruby Scripts/report_xcode_errors.rb icon-ui-test.log
      - name: Export UI test attachments
        if: ${{ always() && (steps.icon_ui_tests.outcome == 'success' || steps.icon_ui_tests.outcome == 'failure') }}
        run: >-
          xcrun xcresulttool export attachments
          --path icon-ui-results.xcresult
          --output-path ui-test-attachments
      - name: Upload UI results
        if: ${{ always() && (steps.icon_ui_tests.outcome == 'success' || steps.icon_ui_tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: icon-ui-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            icon-ui-test.log
            icon-ui-results.xcresult
            icon-assets.json
            ui-test-attachments/
          retention-days: 7
      - name: Fail when app validation fails
        if: ${{ always() && (steps.app_tests.outcome == 'failure' || steps.icon_assets.outcome == 'failure' || steps.icon_ui_tests.outcome == 'failure') }}
        run: exit 1
      - name: Remove UI test simulator
        if: ${{ always() && env.ICON_UI_SIMULATOR_ID != '' }}
        run: |
          xcrun simctl shutdown "$ICON_UI_SIMULATOR_ID" || true
          xcrun simctl delete "$ICON_UI_SIMULATOR_ID"
