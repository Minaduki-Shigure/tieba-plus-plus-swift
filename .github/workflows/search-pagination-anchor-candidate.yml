name: Search pagination anchor candidate

on:
  push:
    branches: [ci/search-pagination-anchor-1004]

permissions:
  contents: read

jobs:
  search-pagination-anchor:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Create clean iPhone 16 Pro on iOS 18.5
        run: |
          set -euo pipefail
          runtime_id=com.apple.CoreSimulator.SimRuntime.iOS-18-5
          xcrun simctl list runtimes -j | jq -e --arg runtime "$runtime_id" \
            'any(.runtimes[]; .identifier == $runtime and .isAvailable == true)'
          device_id="$(xcrun simctl create "Tieba search anchor $GITHUB_RUN_ID" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$runtime_id")"
          echo "CANDIDATE_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          echo "CANDIDATE_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Test held search pagination and the three existing search scopes
        id: anchor
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlusIconsUI \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination "$CANDIDATE_DESTINATION" -parallel-testing-enabled NO \
            -only-testing:TiebaPlusPlusUITests/SearchPaginationAnchorUITests \
            -only-testing:TiebaPlusPlusUITests/SearchScopesUITests \
            -resultBundlePath search-anchor-ui-results.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee search-anchor-ui-test.log
      - name: Report search pagination diagnostics
        if: ${{ always() && steps.anchor.outcome == 'failure' }}
        run: >-
          ruby Scripts/report_xcode_errors.rb --mode full
          --title "Search pagination anchor candidate failed"
          --file App/UITests/SearchPaginationAnchorUITests.swift
          search-anchor-ui-test.log
      - name: Export search pagination evidence
        if: always()
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path search-anchor-ui-results.xcresult --compact > search-anchor-ui-summary.json
          xcrun xcresulttool export attachments \
            --path search-anchor-ui-results.xcresult --output-path search-anchor-ui-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-pagination-anchor-candidate
          path: |
            search-anchor-ui-test.log
            search-anchor-ui-summary.json
            search-anchor-ui-attachments/
      - name: Require exactly four passing pagination and scope tests
        id: anchor_gate
        if: always()
        env:
          UI_OUTCOME: ${{ steps.anchor.outcome }}
        run: |
          ruby -rjson -e '
            abort "The pagination and scope UI command failed" unless ENV.fetch("UI_OUTCOME") == "success"
            summary = JSON.parse(File.read("search-anchor-ui-summary.json"))
            expected = {"result" => "Passed", "totalTestCount" => 4, "passedTests" => 4,
              "failedTests" => 0, "skippedTests" => 0, "expectedFailures" => 0}
            expected.each do |key, value|
              abort "#{key}: expected #{value.inspect}, got #{summary[key].inspect}" unless summary[key] == value
            end
            puts "Verified all four pagination and scope tests passed without skips or expected failures."
          '
      - name: Test suggestions and forum search recovery without rebuilding
        id: integrations
        if: ${{ success() && steps.anchor_gate.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlusIconsUI \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination "$CANDIDATE_DESTINATION" -parallel-testing-enabled NO \
            -only-testing:TiebaPlusPlusUITests/SearchSuggestionsUITests \
            -only-testing:TiebaPlusPlusUITests/ForumSearchResumeUITests \
            -resultBundlePath search-integration-ui-results.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee search-integration-ui-test.log
      - name: Report search integration diagnostics
        if: ${{ always() && steps.integrations.outcome == 'failure' }}
        run: >-
          ruby Scripts/report_xcode_errors.rb --mode full
          --title "Search integration regressions failed"
          --file App/UITests/SearchSuggestionsUITests.swift
          search-integration-ui-test.log
      - name: Export search integration evidence
        if: ${{ always() && steps.integrations.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path search-integration-ui-results.xcresult --compact > search-integration-ui-summary.json
          xcrun xcresulttool export attachments \
            --path search-integration-ui-results.xcresult --output-path search-integration-ui-attachments
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.integrations.outcome != 'skipped' }}
        with:
          name: search-integration-candidate
          path: |
            search-integration-ui-test.log
            search-integration-ui-summary.json
            search-integration-ui-attachments/
      - name: Require exactly three passing search integration tests
        if: ${{ always() && steps.anchor_gate.outcome == 'success' }}
        env:
          UI_OUTCOME: ${{ steps.integrations.outcome }}
        run: |
          ruby -rjson -e '
            abort "The search integration UI command failed" unless ENV.fetch("UI_OUTCOME") == "success"
            summary = JSON.parse(File.read("search-integration-ui-summary.json"))
            expected = {"result" => "Passed", "totalTestCount" => 3, "passedTests" => 3,
              "failedTests" => 0, "skippedTests" => 0, "expectedFailures" => 0}
            expected.each do |key, value|
              abort "#{key}: expected #{value.inspect}, got #{summary[key].inspect}" unless summary[key] == value
            end
            puts "Verified all three search integration tests passed without skips or expected failures."
          '
      - name: Remove candidate simulator
        if: ${{ always() && env.CANDIDATE_DEVICE_ID != '' }}
        run: |
          xcrun simctl shutdown "$CANDIDATE_DEVICE_ID" || true
          xcrun simctl delete "$CANDIDATE_DEVICE_ID"
