name: Adaptive navigation native probe
on:
  push:
    branches: [ci/adaptive-layout-probe-1004]
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: brew install xcodegen
      - run: xcodegen generate --spec NativeNavigationProbe/project.yml
      - name: Probe native layout and keyboard lifecycle
        run: |
          set -o pipefail
          device_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))][0].udid')"
          xcodebuild -project NativeNavigationProbe/NavigationProbe.xcodeproj -scheme NavigationProbe -destination "platform=iOS Simulator,id=$device_id" -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test 2>&1 | tee navigation-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-native-probe
          path: navigation-probe.log
