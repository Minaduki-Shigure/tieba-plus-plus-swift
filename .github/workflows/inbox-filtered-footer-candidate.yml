name: Inbox filtered footer candidate

on:
  push:
    branches: [ci/inbox-filtered-footer-1004]

permissions:
  contents: read

jobs:
  inbox-filtered-footer:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Create clean iPhone 16 Pro on iOS 18.5
        run: |
          set -euo pipefail
          runtime_id=com.apple.CoreSimulator.SimRuntime.iOS-18-5
          xcrun simctl list runtimes -j | jq -e --arg runtime "$runtime_id" \
            'any(.runtimes[]; .identifier == $runtime and .isAvailable == true)'
          device_id="$(xcrun simctl create "Tieba filtered footer $GITHUB_RUN_ID" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro "$runtime_id")"
          echo "CANDIDATE_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          echo "CANDIDATE_DESTINATION=platform=iOS Simulator,id=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Test hidden page continuation and stable reading position
        id: hidden
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlusIconsUI \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination "$CANDIDATE_DESTINATION" -parallel-testing-enabled NO \
            -only-testing:TiebaPlusPlusUITests/InboxFilteredPaginationUITests \
            -resultBundlePath inbox-hidden-ui-results.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee inbox-hidden-ui-test.log
      - name: Report hidden page diagnostics
        if: ${{ always() && steps.hidden.outcome == 'failure' }}
        run: >-
          ruby Scripts/report_xcode_errors.rb --mode full
          --title "Inbox hidden page candidate failed"
          --file App/UITests/InboxFilteredPaginationUITests.swift
          inbox-hidden-ui-test.log
      - name: Export hidden page evidence
        if: always()
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path inbox-hidden-ui-results.xcresult --compact > inbox-hidden-ui-summary.json
          xcrun xcresulttool export attachments \
            --path inbox-hidden-ui-results.xcresult --output-path inbox-hidden-ui-attachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-hidden-page-candidate
          path: |
            inbox-hidden-ui-test.log
            inbox-hidden-ui-summary.json
            inbox-hidden-ui-attachments/
      - name: Require the hidden page regression to pass without skips
        id: hidden_gate
        if: always()
        env:
          UI_OUTCOME: ${{ steps.hidden.outcome }}
        run: |
          ruby -rjson -e '
            abort "The hidden page UI command failed" unless ENV.fetch("UI_OUTCOME") == "success"
            summary = JSON.parse(File.read("inbox-hidden-ui-summary.json"))
            expected = {"result" => "Passed", "totalTestCount" => 1, "passedTests" => 1,
              "failedTests" => 0, "skippedTests" => 0, "expectedFailures" => 0}
            expected.each do |key, value|
              abort "#{key}: expected #{value.inspect}, got #{summary[key].inspect}" unless summary[key] == value
            end
            puts "Verified the hidden page regression passed without skips or expected failures."
          '
      - name: Test the three existing inbox scope regressions without rebuilding
        id: scopes
        if: ${{ success() && steps.hidden_gate.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project TiebaPlusPlus.xcodeproj -scheme TiebaPlusPlusIconsUI \
            -configuration Debug -derivedDataPath build/DerivedData \
            -destination "$CANDIDATE_DESTINATION" -parallel-testing-enabled NO \
            -only-testing:TiebaPlusPlusUITests/InboxScopesUITests \
            -resultBundlePath inbox-scopes-ui-results.xcresult \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO \
            test-without-building 2>&1 | tee inbox-scopes-ui-test.log
      - name: Report inbox scope diagnostics
        if: ${{ always() && steps.scopes.outcome == 'failure' }}
        run: >-
          ruby Scripts/report_xcode_errors.rb --mode full
          --title "Inbox scope regressions failed"
          --file App/UITests/InboxScopesUITests.swift
          inbox-scopes-ui-test.log
      - name: Export inbox scope evidence
        if: ${{ always() && steps.scopes.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path inbox-scopes-ui-results.xcresult --compact > inbox-scopes-ui-summary.json
          xcrun xcresulttool export attachments \
            --path inbox-scopes-ui-results.xcresult --output-path inbox-scopes-ui-attachments
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.scopes.outcome != 'skipped' }}
        with:
          name: inbox-existing-scopes-candidate
          path: |
            inbox-scopes-ui-test.log
            inbox-scopes-ui-summary.json
            inbox-scopes-ui-attachments/
      - name: Require all three existing inbox scope regressions to pass
        if: ${{ always() && steps.hidden_gate.outcome == 'success' }}
        env:
          UI_OUTCOME: ${{ steps.scopes.outcome }}
        run: |
          ruby -rjson -e '
            abort "The existing inbox scope UI command failed" unless ENV.fetch("UI_OUTCOME") == "success"
            summary = JSON.parse(File.read("inbox-scopes-ui-summary.json"))
            expected = {"result" => "Passed", "totalTestCount" => 3, "passedTests" => 3,
              "failedTests" => 0, "skippedTests" => 0, "expectedFailures" => 0}
            expected.each do |key, value|
              abort "#{key}: expected #{value.inspect}, got #{summary[key].inspect}" unless summary[key] == value
            end
            puts "Verified all three existing inbox scope regressions passed without skips or expected failures."
          '
      - name: Remove candidate simulator
        if: ${{ always() && env.CANDIDATE_DEVICE_ID != '' }}
        run: |
          xcrun simctl shutdown "$CANDIDATE_DEVICE_ID" || true
          xcrun simctl delete "$CANDIDATE_DEVICE_ID"
