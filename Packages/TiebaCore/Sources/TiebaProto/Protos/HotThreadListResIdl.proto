// tbclient.HotThreadList.HotThreadListResponse
syntax = "proto3";

import "Error.proto";
import "FrsTabInfo.proto";
import "RecommendTopicList.proto";
import "ThreadInfo.proto";

message HotThreadListResIdl {
    Error error = 1;
    message DataRes {
        repeated RecommendTopicList topic_list = 1;
        repeated ThreadInfo thread_info = 2;
        repeated FrsTabInfo hot_thread_tab_info = 3;
    }
    DataRes data = 2;
}
