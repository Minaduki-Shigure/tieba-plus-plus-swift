// tbclient.GeneralTabList.GeneralTabListResponse
syntax = "proto3";

import "Error.proto";
import "ThreadInfo.proto";
import "User.proto";

message GeneralTabListResIdl {
    Error error = 1;
    message DataRes {
        repeated ThreadInfo general_list = 1;
        int32 has_more = 2;
        repeated User user_list = 3;
        int32 sort_type = 7;
    }
    DataRes data = 2;
}
