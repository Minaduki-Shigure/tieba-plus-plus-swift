// tbclient.UserLikeResIdl
syntax = "proto3";

import "Error.proto";
import "ThreadInfo.proto";

message UserLikeResIdl {
    message ConcernData {
        ThreadInfo thread_list = 1;
        int32 recom_type = 3;
        int32 source = 4;
    }

    message DataRes {
        repeated ConcernData thread_info = 1;
        string page_tag = 2;
        int32 has_more = 4;
        string user_tips = 5;
        string last_tips = 7;
        uint64 req_unix = 10;
        int32 user_tips_type = 11;
    }

    Error error = 1;
    DataRes data = 2;
}
