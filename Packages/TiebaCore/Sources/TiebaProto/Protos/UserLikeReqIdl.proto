// tbclient.UserLikeReqIdl
syntax = "proto3";

import "CommonReq.proto";

message UserLikeReqIdl {
    message DataReq {
        CommonReq common = 1;
        string page_tag = 2;
        uint64 last_req_unix = 3;
        int32 follow_type = 4;
        int32 load_type = 5;
    }

    DataReq data = 1;
}
