// tbclient.PersonalizedReqIdl
syntax = "proto3";

import "CommonReq.proto";

message PersonalizedReqIdl {
    message DataReq {
        CommonReq common = 1;
        uint32 tag_code = 2;
        uint32 need_tags = 3;
        uint32 load_type = 4;
        uint32 page_thread_count = 5;
        uint32 pn = 6;
        uint32 sug_count = 7;
        int32 q_type = 11;
        uint32 need_forumlist = 22;
        uint32 new_net_type = 23;
        int32 pre_ad_thread_count = 26;
        int32 new_install = 27;
        int32 request_times = 28;
        string invoke_source = 29;
    }

    DataReq data = 1;
}
