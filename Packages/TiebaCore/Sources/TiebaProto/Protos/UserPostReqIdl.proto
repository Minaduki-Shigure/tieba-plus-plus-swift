// tbclient.UserPost.UserPostReqIdl
syntax = "proto3";

import "CommonReq.proto";

message UserPostReqIdl {
    message DataReq {
        int64 uid = 1;
        uint32 rn = 2;
        optional uint32 is_thread = 4;
        uint32 need_content = 5;
        optional uint32 subtype = 9;
        uint32 pn = 26;
        CommonReq common = 27;
        int32 q_type = 32;
        optional int32 is_view_card = 33;
    }
    DataReq data = 1;
}
