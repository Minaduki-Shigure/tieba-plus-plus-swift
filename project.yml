name: TiebaPlusPlus

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "16.0"
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  TiebaCore:
    path: Packages/TiebaCore

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  TiebaPlusPlus:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "贴吧++"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.social-networking
        NSPhotoLibraryAddUsageDescription: "用于将您选择的贴吧图片保存到系统照片。"
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: io.github.minaduki.tieba-plus-plus
            CFBundleURLSchemes:
              - tieba-plus-plus
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: TiebaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.minaduki.tieba-plus-plus
        PRODUCT_NAME: TiebaPlusPlus
        MARKETING_VERSION: 0.52.0
        CURRENT_PROJECT_VERSION: 52
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - TiebaPlusPlusTests
      gatherCoverageData: true

  TiebaPlusPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: TiebaPlusPlus
      - package: TiebaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.minaduki.tieba-plus-plus.tests
        GENERATE_INFOPLIST_FILE: true
